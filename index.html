<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Back to Me</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;overscroll-behavior:none}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
main{padding:20vh 16px 10vh;max-width:640px;margin:0 auto}
h1{font-weight:300;letter-spacing:.3em;text-transform:lowercase;text-align:center;font-size:20px;margin:0 0 22vh}
h2{font-weight:300;font-size:clamp(22px,6.5vw,34px);line-height:1.3;text-align:center;margin:0 0 28vh;padding:0 8px;letter-spacing:.04em}
figure{margin:0 0 28vh;will-change:transform,opacity}
figure img{width:100%;height:auto;display:block;border-radius:6px;background:#111}
.btn{display:block;width:100%;margin-top:12px;padding:14px;font-size:16px;color:#fff;background:#000;border:1px solid #fff;border-radius:8px}
.btn:active{background:#fff;color:#000}
#art{margin:0 auto;padding:0 0 max(24px,env(safe-area-inset-bottom));width:max-content;font-family:ui-monospace,Menlo,Consolas,monospace;
 font-size:var(--fs,3px);line-height:1;color:#000;white-space:pre;overflow:hidden;user-select:none;-webkit-user-select:none}
#art span{color:#000;transition:color .6s}
#art span.on{color:#fff}
#loader{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .lt{font-weight:300;letter-spacing:.35em;font-size:14px;text-transform:lowercase;animation:pulse 1.8s ease-in-out infinite}
#loader .bar{width:40vw;max-width:220px;height:1px;background:#333;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
@keyframes pulse{50%{opacity:.35}}
#hint{position:fixed;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));z-index:5;text-align:center;font-weight:300;letter-spacing:.3em;font-size:13px;text-transform:lowercase;pointer-events:none;opacity:0;transition:opacity .8s}
#hint.show{opacity:1}
#hint b{display:block;font-size:22px;font-weight:300;margin-bottom:6px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;flex-direction:column;z-index:10}
#ov.show{display:flex}
#ov header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));text-align:right}
#ov header button{font-size:16px;padding:10px 18px;color:#fff;background:#000;border:1px solid #fff;border-radius:8px}
#txt{flex:1;overscroll-behavior:contain;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px calc(32px + env(safe-area-inset-bottom));
 white-space:pre-wrap;font-size:18px;line-height:1.6;max-width:640px;margin:0 auto;width:100%}
</style>
</head>
<body>
<main id="gallery"><h1 class="fade">I'll be all that you want. I'll be all that you need..</h1></main>
<pre id="art" aria-hidden="true"></pre>
<div id="loader"><div class="lt">loading</div><div class="bar"><i id="lbar"></i></div></div>
<div id="hint"><b>&uarr;</b>scroll up</div>
<div id="ov" role="dialog" aria-modal="true"><header><button id="close">Close</button></header><div id="txt" data-lenis-prevent></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
const ASCII = "                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                        =+-                                                         \n                                  *@@#--:-.--=%%.                                                   \n                              .#@ .              *-#@*#%%%#+*#           .#%.                       \n                            @%.                  @@*        -#+              *@.                    \n                          %@          :*@@%#- =+###@*    +*=    #%              -@                  \n                         @*      -%@#:            ...#        ##  .%              :@                \n                       +@      @=         =@@%#  -=*#+-..+%#*    :%-*                %              \n                      *.      %        @#        -+**         *%:   =##               @             \n                     +#      @*      @%       :*#      ##       .@    -@.              ##           \n                     @      :@      %%       #.#:         %#      #     %=              %           \n                     @      %@.*    @#      *  #    +*-     %      *     @=             =           \n                     @*     @@@+     #=:    ++  #      *     #      @    *@           : @           \n                     #%     @%  @      +#   --*    .*#*-     :      *   @ =:           @            \n                      %@   :@@   %*      **  : ##  -         #     @   #  @          *@             \n                       %@%  @@.    @.      +%-     =**#%%#+      =@   @  +@         #@              \n                          @%+@@      %        %@*.   %@*     -#@+  .@*  @+       .%@#               \n                         .%%. *%       @=        +@@%*-+*+++:    :@..%@+    .@@%@#=                 \n                        #*      @        =%*.               :-*%-=%@@#  :@@%   #:                   \n                       -*        *@         .=%+-.:==++#@@@#*#@@@%*@  *%%*   *%                     \n                       %           .@             -*++**=       %@% @@    =%+                       \n                       +#:           :#                       %@# +@ :  .%.                         \n                        @@             +%.                 =#@#  @#   .%                            \n                        -@@-             =@#             *%%+   @=*  @                              \n                          @@@*              *@*... -+%@@%=     @%  #%                               \n                           =%@%                 *=           -@% :@+-.                              \n                             -+@@                        =%%+  *#                                   \n                                -%@%:           .=#%@@#+-..-+%.                                     \n                             + @%+.-=%@@@%##%%%#*: %@@*#%@:                                         \n                          :#@%#=  .#.-@@ *%=   : #+  +   #                                          \n                         #@#@%*+..-#+  -% %   : +=  %    #                                          \n                            .   *    +**- @    :+  % :: #@                                          \n                               +  *#   %  #.   #== +   % @                                          \n                               *:*.   :@ +    %   %   *  @                                          \n                              =-  .   #*     .   -:  %   %                                          \n                                  #*==       %   %  ++   %                                          \n                                             %  % #  +   #                                          \n                                             #-##    :   %                                          \n                                             %=-     *: -%                                          \n                                                     #  #                                           \n                                                    *   -                                           \n                                                   +  %                                             \n                                                 -- :=                                              \n                                                *+   %                                              \n                                                 #   %                                              \n                                                 =#  %*                                             \n                                                  *  =%                                             \n                                                   =  @                                             \n                                                   #  @                                             \n                                                   *   #                                            \n                                                  %  .                                              \n                                                 #= -                                               \n                                                ** +                                                \n                                                 =  =-                                              \n                                                 #+. :                                              \n                                                 -#                                                 \n                                                *=                                                  \n                                               - %                                                  \n                                              *  *                                                  \n                                             =  #=.                                                 \n                                            =.%*                                                    \n                                            # %                                                     \n                                            % %                                                     \n                                            = =%                                                    \n                                             * @:                                                   \n                                             % %*                                                   \n                                             # **                                                   \n                                             - ++                                                   \n                                             -  +                                                   \n                                             = -%                                                   \n                                             - *-                                                   \n                                            :  *-                                                   \n                                            *  #                                                    \n                                            *  @                                                    \n                                           +  -*                                                    \n                                           .  --                                                    \n                                           #  =#                                                    \n                                           *  %:                                                    \n                                           #  @:                                                    \n                                           . .*                                                     \n                                          +  =                                                      \n                                          =  +                                                      \n                                          =  +                                                      \n                                         +   .                                                      \n                                         +  .                                                       \n                                         *  *-                                                      \n                                         +  *                                                       \n                                         +  =                                                       \n                                         :  +                                                       \n                                        +  .*                                                       \n                                        +   +                                                       \n                                        =   :                                                       \n                                       :   =                                                        \n                                       +   =                                                        \n                                       :   -                                                        \n                                       *   *                                                        \n                                      #+   ++                                                       \n                                      #=   *                                                        \n                                      .   +=                                              \n                                     *-   =        \n                                    -*   *                                                          \n                                    ==  -                                                           \n                                    +  *%                                                           \n                                   :  -@                                                            \n                                   =                                                                \n                                  *+   *                                                            \n                                   #   ++                                                           \n                                   #    =                                                           \n                                   *#   =                                                           \n                                    #                                                               \n                                    -@   *                                                          \n                                     +-  *                                                          \n                                      @  :-                                                         \n                                     :+   @                                                         \n                                     #   %                                                          \n                                    +  %#                                                          \n                                    + =+                                                            \n                                   *- .*                                                            \n                                   *+  #*                                                           \n                                    *= .#=                                                          \n                                     %# %*                                                          \n                                      @# ##                                                         \n                                      :%  @                                                         \n                                       +* +.                                                        \n                                        % =#                                                        \n                                        *::*                                                        \n                                        * +*                                                        \n                                        # =*                                                        \n                                       #. +                                                         \n                                       #  #                                                         \n                                       %  %                                                         \n                                       %  %                                                         \n                                       *  %                                                         \n                                       =  #                                                         \n                                       +  +                                                         \n                                      =*  :-                                                        \n                                      *=  :*                                                        \n                                      **  *:                                                        \n                                       =  -                                                         \n                                       =  .                                                         \n                                      #   -                                                         \n                                      #   -                                                         \n                                      #   +                                                         \n                                      #   =                                                         \n                                      #   -=                                                        \n                                       #  +                                                         \n                                       #  +:                                                        \n                                       -  -=                                                        \n                                       =   =                                                        \n                                       -.  ::                                                       \n                                        -   *                                                       \n                                        --                                                          \n                                         ..  +                                                      \n                                          =  .                                                      \n                                         :.   =                                                     \n                                           =   :                                                    \n                                           -                                                        \n                                            #   :                                                   \n                                             :   +.                                                 \n                                             ==    -                                                \n                                              *.                                                    \n                                               .                                                    \n                                                -                                                   \n                                                 +.                                                 \n                                                  =                                                 \n                                                   -                                                \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n                                                                                                    \n";
const IMAGES = [
  {"name": "back-to-me", "src": "assets/back-to-me.jpg", "text": ""},
  {"heading": "Bonus (ignore this)"},
  {"name": "poem", "src": "assets/poem.jpg", "text": " The Rose with a Long Stem \n\nThey say to me, a rose with a long stem is a rose begging to die.\n\n\"Water can't reach the petals!\" They say\n\"Any wind can snap the flower!\" They say\n\nI was apt to agree. But yet it stood there. Shadowing everything I have ever known. Its petals never drop. The resplendent red shadows it casts when shone by the sun. I thought it was just a small rose with an overgrown stem. It turned out to be everything that I have ever known. \n\n\"How can anyone say this beautiful rose is dying?\" I say. Unknowingly my hand was already holding the rose. I tried to put it down, yet it was moving with my hand. I then see the serpentine stem was entwining my arms. Somehow I never realized, the stem was enveloping my whole body. Its thorns seeping deep inside my skin. Yet it didn't hurt.\n\nMy wonder wanders, I seek to know. What could this resplendent rose be feeding upon? I search for its root. Only to realize the base of the stem grafted to my chest. I finally see. The rose can never die. Not as long as my heart beats. It didn't matter how long the stem is. I am always keeping it alive. My blood can always reach its petals. \n"},
  {"heading": "And here's the poem"},
  {"name": "message", "src": "assets/message.jpg", "text": "Hey, I'm sorry. I know I'm super late, but... happy birthday. I'm sorry I didnt say it on your actual birthday. I wish I had known that you would be okay with me saying it.\n\nAku buat semua ini dengan harapan bisa bikin kamu senang. Aku engga tau apakah kita bisa bareng lagi. Aku engga maksa, aku hargai perasaan kamu. Setidaknya bolehkan aku untuk mengungkapkan ini: I still love you... \n\nAku buatin puisi untuk kamu, semoga kamu mau baca. \n\n It would mean a lot to me."},
  {"heading": "I wrote a handwritten note for you. You can press the button to open the text directly since my handwriting suck balls"},
  {"heading": "\n\n\n"},
  {"heading": "I know it's ugly... I tried my best. I hope you like it."},
  {"name": "rose", "src": "assets/rose.jpg", "text": ""},
  {"heading": "I actually drew the rose myself"},
];
// Add {"heading": "your text"} entries anywhere in this list to place a heading between images.

// ---- Smooth scroll (Lenis; touch stays native for best mobile feel) ----
const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9 });
lenis.stop(); // locked until loading finishes
const loads = [];
gsap.ticker.add(t => lenis.raf(t * 1000));
gsap.ticker.lagSmoothing(0);

// ---- Gallery ----
const gallery = document.getElementById('gallery');
const ov = document.getElementById('ov'), txt = document.getElementById('txt');
IMAGES.forEach(it => {
  if (it.heading) {
    const h = document.createElement('h2'); h.className = 'fade'; h.textContent = it.heading;
    if (it.fadeDist) h.dataset.fadeDist = it.fadeDist;
    if (it.yDist) h.dataset.yDist = it.yDist;
    gallery.appendChild(h); return;
  }
  const f = document.createElement('figure'); f.className = 'fade';
  if (it.fadeDist) f.dataset.fadeDist = it.fadeDist;
  if (it.yDist) f.dataset.yDist = it.yDist;
  const img = new Image(); img.alt = it.name; img.decoding = 'async';
  loads.push(new Promise(r => { img.onload = img.onerror = r; })); img.src = it.src;
  f.appendChild(img);
  if (it.text && it.text.trim()) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = 'Read text';
    b.onclick = () => { txt.textContent = it.text; ov.classList.add('show'); txt.scrollTop = 0; document.body.style.overflow = 'hidden'; lenis.stop(); };
    f.appendChild(b);
  }
  gallery.appendChild(f);
});
function closeOv(){ ov.classList.remove('show'); document.body.style.overflow = ''; lenis.start(); }
document.getElementById('close').onclick = closeOv;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOv(); });

// ---- ASCII art ----
const art = document.getElementById('art');
const rows = ASCII.replace(/\r/g,'').split('\n');
while (rows.length && !rows[rows.length-1].trim()) rows.pop();
// auto-centre: strip common left indent and trailing spaces
const indent = Math.min(...rows.filter(r => r.trim()).map(r => r.match(/^ */)[0].length));
for (let i = 0; i < rows.length; i++) rows[i] = rows[i].slice(indent).replace(/\s+$/,'');
const COLS = Math.max(...rows.map(r => r.length));
function fit(){ document.documentElement.style.setProperty('--fs', Math.min(innerWidth * 0.94, 700) / (COLS * 0.6) + 'px'); }
fit(); addEventListener('resize', fit);
const cells = [];           // cells[y][x] = span or null
const frag = document.createDocumentFragment();
rows.forEach((line, y) => {
  cells[y] = [];
  for (let x = 0; x < line.length; x++) {
    const c = line[x];
    if (c === ' ') { frag.appendChild(document.createTextNode(' ')); cells[y][x] = null; }
    else { const s = document.createElement('span'); s.textContent = c; frag.appendChild(s); cells[y][x] = s; }
  }
  frag.appendChild(document.createTextNode('\n'));
});
art.appendChild(frag);

// BFS levels, 8-neighbour, starting from bottom-most visible character
// (extra components are seeded afterwards so everything lights up eventually)
function bfsLevels() {
  const seen = rows.map(r => new Uint8Array(r.length));
  const levels = [];
  const seeds = [];
  for (let y = rows.length-1; y >= 0; y--) for (let x = 0; x < rows[y].length; x++) if (cells[y][x]) seeds.push([y,x]);
  for (const [sy,sx] of seeds) {
    if (seen[sy][sx]) continue;
    seen[sy][sx] = 1;
    let frontier = [[sy,sx]], d = 0;
    while (frontier.length) {
      (levels[d] = levels[d] || []).push(...frontier);
      const next = [];
      for (const [y,x] of frontier)
        for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
          const ny=y+dy, nx=x+dx;
          if (ny<0||ny>=rows.length||nx<0||nx>=rows[ny].length) continue;
          if (!cells[ny][nx] || seen[ny][nx]) continue;
          seen[ny][nx] = 1; next.push([ny,nx]);
        }
      frontier = next; d++;
    }
    break; // first component only; others handled below
  }
  // remaining disconnected pieces: run as further components sequentially after
  for (const [sy,sx] of seeds) {
    if (seen[sy][sx]) continue;
    seen[sy][sx] = 1;
    let frontier = [[sy,sx]], d = levels.length;
    while (frontier.length) {
      (levels[d] = levels[d] || []).push(...frontier);
      const next = [];
      for (const [y,x] of frontier)
        for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
          const ny=y+dy, nx=x+dx;
          if (ny<0||ny>=rows.length||nx<0||nx>=rows[ny].length) continue;
          if (!cells[ny][nx] || seen[ny][nx]) continue;
          seen[ny][nx] = 1; next.push([ny,nx]);
        }
      frontier = next; d++;
    }
  }
  return levels;
}
const LEVEL_MS = 55; // slow: ~1 row per 0.2s so a thumb can keep up
function illuminate() {
  const levels = bfsLevels();
  let i = 0;
  (function step() {
    if (i >= levels.length) return;
    levels[i++].forEach(([y,x]) => cells[y][x].classList.add('on'));
    setTimeout(step, LEVEL_MS);
  })();
}

// ---- Scroll-driven fade/rise for everything except the ASCII art ----
const fades = [...document.querySelectorAll('.fade')].map(el => ({
  el,
  fadeDist: parseFloat(el.dataset.fadeDist) || (el.tagName === 'FIGURE' ? 0.45 : 0.4),
  yDist: parseFloat(el.dataset.yDist) || (el.tagName === 'FIGURE' ? 35 : 50),
  o: gsap.quickTo(el, 'opacity', { duration: .5, ease: 'power2.out' }),
  y: gsap.quickTo(el, 'y', { duration: .7, ease: 'power3.out' }),
  sc: gsap.quickTo(el, 'scale', { duration: .7, ease: 'power3.out' })
}));
gsap.set('.fade', { opacity: 0 });
function updateFades() {
  const vh = innerHeight, mid = vh / 2;
  for (const f of fades) {
    const r = f.el.getBoundingClientRect();

    // Edge-aware distance: 0 while element intersects viewport midpoint
    let dist = 0;
    if (r.bottom < mid) {
      dist = (mid - r.bottom) / vh;       // scrolled past (easing out upward)
    } else if (r.top > mid) {
      dist = (r.top - mid) / vh;          // entering from below
    }

    // Small buffer zone so elements stay 100% opaque before fading
    const dEff = Math.max(0, dist - 0.05);
    const opacity = Math.max(0, Math.min(1, 1 - dEff / f.fadeDist));

    // Directional Y drift (-1 to 1 based on center)
    const c = r.top + r.height / 2;
    const dir = Math.max(-1, Math.min(1, (c - mid) / vh));

    f.o(opacity);
    f.y(dir * f.yDist);
    f.sc(1 - Math.min(dist, 0.5) * 0.1);
  }
}
lenis.on('scroll', updateFades);
addEventListener('resize', updateFades);

// ---- Start: jump to bottom, then illuminate ----
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function toBottom(){ lenis.scrollTo(document.documentElement.scrollHeight, { immediate: true, force: true }); updateFades(); }
const hint = document.getElementById('hint'), loader = document.getElementById('loader'), lbar = document.getElementById('lbar');
let done = 0; loads.forEach(p => p.then(() => { lbar.style.width = (++done / loads.length * 100) + '%'; }));
const pageLoaded = new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', r));
const minWait = new Promise(r => setTimeout(r, 900));
const cap = new Promise(r => setTimeout(r, 20000));   // never hang forever
Promise.race([Promise.all([...loads, pageLoaded, minWait, document.fonts ? document.fonts.ready : 0]), cap]).then(() => {
  toBottom();
  requestAnimationFrame(() => { toBottom(); loader.classList.add('done'); });
  setTimeout(() => { loader.remove(); lenis.start(); hint.classList.add('show'); }, 900);
  setTimeout(illuminate, 1800);
  // hide the prompt once the user starts scrolling up
  const bottom = () => document.documentElement.scrollHeight - innerHeight;
  const chk = () => { if (bottom() - scrollY > 60) { hint.classList.remove('show'); lenis.off('scroll', chk); } };
  lenis.on('scroll', chk);
});
</script>
</body>
</html>
